<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome Home, Linah 🌹</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg1:#2a0613; --bg2:#0d0208; --rose:#e11d48; --gold:#f5d28a; --text:#ffe9ef;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%;}
body{
  background:radial-gradient(ellipse at 50% 30%,var(--bg1),var(--bg2) 75%) fixed;
  color:var(--text);font-family:'Playfair Display',Georgia,serif;
  overflow-x:hidden;text-align:center;
}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;position:relative;z-index:2}
.stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.2;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.9;transform:scale(1.6)}}

.rose-wrap{position:relative;width:min(78vw,300px);cursor:pointer;-webkit-tap-highlight-color:transparent;animation:sway 6s ease-in-out infinite;transform-origin:50% 100%}
.rose-wrap::before{content:"";position:absolute;left:50%;top:30%;width:120%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(225,29,72,.45),transparent 65%);filter:blur(10px);animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{opacity:.5;transform:translate(-50%,-50%) scale(1.1)}}
@keyframes sway{50%{transform:rotate(2.5deg)}}
svg{width:100%;height:auto;display:block;position:relative;overflow:visible}

.p{transform-origin:150px 150px;transform:rotate(var(--r)) scale(0);opacity:0;animation:bloom 1.1s cubic-bezier(.2,.9,.3,1.2) forwards;animation-delay:var(--d)}
@keyframes bloom{to{transform:rotate(var(--r)) scale(1);opacity:1}}
.stem{stroke-dasharray:260;stroke-dashoffset:260;animation:draw 1.6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.leaf{transform-origin:150px 330px;transform:scale(0);animation:pop .8s ease forwards;animation-delay:1.4s}
.leaf.b{animation-delay:1.7s}
@keyframes pop{to{transform:scale(1)}}

h1{font-family:'Great Vibes','Brush Script MT',cursive;font-weight:400;margin:.2em 0 0;line-height:1.1;
  font-size:clamp(2.4rem,11vw,4.6rem);color:var(--text);text-shadow:0 0 18px rgba(225,29,72,.7);
  opacity:0;animation:fade 1.5s ease 2.2s forwards}
h1 span{display:block;font-size:1.25em;color:var(--gold);text-shadow:0 0 22px rgba(245,210,138,.55)}
.sub{min-height:3.4em;max-width:30ch;margin:.8em auto 0;font-style:italic;font-size:clamp(1rem,4.4vw,1.25rem);line-height:1.6;color:#ffd0dc}
.sub::after{content:"|";animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes fade{to{opacity:1}}

button{margin-top:1.2em;font:inherit;color:#fff;background:linear-gradient(135deg,#e11d48,#9f1239);border:0;border-radius:999px;
  padding:.8em 1.7em;font-size:1rem;cursor:pointer;box-shadow:0 6px 24px rgba(225,29,72,.5);opacity:0;animation:fade 1s ease 3s forwards;transition:transform .2s}
button:active{transform:scale(.95)}
.note{max-width:34ch;margin:1.2em auto 0;padding:1.1em 1.3em;border:1px solid rgba(245,210,138,.4);border-radius:16px;
  background:rgba(255,255,255,.06);backdrop-filter:blur(6px);line-height:1.7;display:none;animation:fade .9s ease forwards;opacity:0}
.note.show{display:block}
.hint{font-size:.8rem;opacity:.55;margin-top:1em}

.fall{position:fixed;top:-40px;z-index:1;pointer-events:none;animation:fall linear forwards}
.petal{width:100%;height:100%;border-radius:0 100% 0 100%;background:linear-gradient(135deg,#fb7185,#be123c);animation:spin 4s ease-in-out infinite alternate}
@keyframes fall{to{transform:translate3d(var(--x),112vh,0)}}
@keyframes spin{to{transform:rotate(80deg) rotateY(60deg)}}
.heart{position:fixed;z-index:3;pointer-events:none;color:#fb7185;animation:rise 2s ease-out forwards}
@keyframes rise{to{transform:translate(var(--x),-60vh) scale(1.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.rose-wrap,.rose-wrap::before,.stars i{animation:none}}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<main>
  <div class="rose-wrap" id="rose" aria-label="A blooming red rose">
    <svg viewBox="0 0 300 420" role="img">
      <defs>
        <radialGradient id="g1" cx="50%" cy="70%" r="70%"><stop offset="0" stop-color="#be123c"/><stop offset="1" stop-color="#7f0d2a"/></radialGradient>
        <radialGradient id="g2" cx="50%" cy="70%" r="70%"><stop offset="0" stop-color="#e11d48"/><stop offset="1" stop-color="#9f1239"/></radialGradient>
        <radialGradient id="g3" cx="50%" cy="70%" r="70%"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#e11d48"/></radialGradient>
        <linearGradient id="gs" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#166534"/></linearGradient>
      </defs>
      <path class="stem" d="M150 190 C140 250 160 300 150 410" fill="none" stroke="url(#gs)" stroke-width="9" stroke-linecap="round"/>
      <path class="leaf" d="M152 320 C200 290 235 300 250 275 C240 325 195 340 152 320Z" fill="#22c55e" stroke="#166534"/>
      <path class="leaf b" d="M148 355 C100 330 65 340 50 315 C60 365 105 380 148 355Z" fill="#16a34a" stroke="#14532d"/>
      <g stroke="rgba(60,0,15,.55)" stroke-width="1.5">
        <ellipse class="p" style="--r:0deg;--d:.1s"   cx="150" cy="98" rx="50" ry="66" fill="url(#g1)"/>
        <ellipse class="p" style="--r:72deg;--d:.2s"  cx="150" cy="98" rx="50" ry="66" fill="url(#g1)"/>
        <ellipse class="p" style="--r:144deg;--d:.3s" cx="150" cy="98" rx="50" ry="66" fill="url(#g1)"/>
        <ellipse class="p" style="--r:216deg;--d:.4s" cx="150" cy="98" rx="50" ry="66" fill="url(#g1)"/>
        <ellipse class="p" style="--r:288deg;--d:.5s" cx="150" cy="98" rx="50" ry="66" fill="url(#g1)"/>
        <ellipse class="p" style="--r:36deg;--d:.6s"  cx="150" cy="112" rx="38" ry="50" fill="url(#g2)"/>
        <ellipse class="p" style="--r:108deg;--d:.7s" cx="150" cy="112" rx="38" ry="50" fill="url(#g2)"/>
        <ellipse class="p" style="--r:180deg;--d:.8s" cx="150" cy="112" rx="38" ry="50" fill="url(#g2)"/>
        <ellipse class="p" style="--r:252deg;--d:.9s" cx="150" cy="112" rx="38" ry="50" fill="url(#g2)"/>
        <ellipse class="p" style="--r:324deg;--d:1s"  cx="150" cy="112" rx="38" ry="50" fill="url(#g2)"/>
        <ellipse class="p" style="--r:0deg;--d:1.1s"   cx="150" cy="126" rx="26" ry="34" fill="url(#g3)"/>
        <ellipse class="p" style="--r:90deg;--d:1.2s"  cx="150" cy="126" rx="26" ry="34" fill="url(#g3)"/>
        <ellipse class="p" style="--r:180deg;--d:1.3s" cx="150" cy="126" rx="26" ry="34" fill="url(#g3)"/>
        <ellipse class="p" style="--r:270deg;--d:1.4s" cx="150" cy="126" rx="26" ry="34" fill="url(#g3)"/>
        <circle class="p" style="--r:0deg;--d:1.5s" cx="150" cy="150" r="15" fill="#fda4af"/>
        <path class="p" style="--r:0deg;--d:1.6s" d="M140 148 C145 138 160 140 160 152 C160 162 146 164 144 155" fill="none" stroke="#9f1239" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </svg>
  </div>

  <h1>Welcome home!<span>Linah</span></h1>
  <p class="sub" id="typed" aria-live="polite"></p>
  <button id="btn">Open your surprise 💌</button>
  <div class="note" id="note">
    Home was never just a place, Linah.<br>
    It&rsquo;s wherever you are &mdash; and I&rsquo;m so happy you&rsquo;re here. ❤️
  </div>
  <div class="hint">Tap the rose 🌹</div>
</main>

<script>
(function(){
  var rnd=function(a,b){return Math.random()*(b-a)+a};

  // twinkling stars
  var stars=document.getElementById('stars');
  for(var i=0;i<45;i++){var s=document.createElement('i');
    s.style.left=rnd(0,100)+'%';s.style.top=rnd(0,100)+'%';
    s.style.animationDelay=rnd(0,3)+'s';s.style.animationDuration=rnd(2,5)+'s';stars.appendChild(s);}

  // falling rose petals
  function petal(){
    var d=document.createElement('div');d.className='fall';
    var size=rnd(10,20);
    d.style.cssText='left:'+rnd(0,100)+'vw;width:'+size+'px;height:'+size+'px;--x:'+rnd(-80,80)+'px;animation-duration:'+rnd(7,13)+'s';
    d.innerHTML='<div class="petal"></div>';
    document.body.appendChild(d);
    setTimeout(function(){d.remove()},14000);
  }
  setTimeout(function(){setInterval(petal,650)},1800);

  // typewriter message
  var text="Every rose blooms brighter when you're near. I'm so glad you're back.";
  var el=document.getElementById('typed'),n=0;
  function type(){ if(n<=text.length){el.firstChild?el.firstChild.nodeValue=text.slice(0,n):el.insertBefore(document.createTextNode(text.slice(0,n)),el.firstChild);n++;setTimeout(type,55);} }
  setTimeout(type,3200);

  // hearts burst
  function burst(x,y){
    for(var i=0;i<14;i++){
      var h=document.createElement('div');h.className='heart';
      h.textContent=['❤','💖','💕','🌹'][Math.floor(rnd(0,4))];
      h.style.cssText='left:'+x+'px;top:'+y+'px;font-size:'+rnd(14,30)+'px;--x:'+rnd(-120,120)+'px;animation-delay:'+rnd(0,.3)+'s';
      document.body.appendChild(h);
      setTimeout(function(e){e.remove()},2400,h);
    }
  }
  var rose=document.getElementById('rose');
  rose.addEventListener('click',function(e){burst(e.clientX,e.clientY);for(var i=0;i<8;i++)petal();});

  // surprise note
  var btn=document.getElementById('btn'),note=document.getElementById('note');
  btn.addEventListener('click',function(e){
    note.classList.add('show');btn.style.display='none';
    burst(e.clientX,e.clientY);for(var i=0;i<14;i++)petal();
    note.scrollIntoView({behavior:'smooth',block:'center'});
  });
})();
</script>
</body>
</html>
